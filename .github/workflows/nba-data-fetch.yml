name: NBA Data Fetch

# NOT scheduled: Basketball Reference returns HTTP 403 to GitHub's datacenter
# IPs, so scraping from Actions fetches nothing. Game logs are refreshed by a
# local cron on a residential IP (server/python_scripts/daily_fetch.sh).
# Kept for manual runs / reference only.
on:
  workflow_dispatch:  # Manual trigger only (will 403 on BBRef from runner IPs)

jobs:
  fetch-game-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd server/python_scripts
          pip install -r requirements.txt

      - name: Fetch yesterday's game stats (Basketball Reference)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd server/python_scripts
          python fetch_bref_yesterdays_games.py

      - name: Fetch yesterday's advanced stats (Basketball Reference)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd server/python_scripts
          python fetch_bref_advanced_stats.py --yesterday
